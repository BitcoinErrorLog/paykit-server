[package]
name = "paykit-server-e2e"
version = "0.1.1-rc4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "End-to-end test support for Paykit Server"
publish = false

[[bin]]
name = "paykit-server-e2e-process"
path = "../paykit-server/src/main.rs"
test = false

[dependencies]
anyhow.workspace = true
paykit-server = { path = "../paykit-server", features = ["test-utils"] }
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bitcoin.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek.workspace = true
locks-core.workspace = true
paykit-lib.workspace = true
paykit-sdk.workspace = true
pubky.workspace = true
pubky-testnet.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
time.workspace = true
tower = { version = "0.5", features = ["util"] }
http-relay = { version = "0.7", default-features = false, features = ["server"] }

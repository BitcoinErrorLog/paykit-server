[workspace]
members = ["paykit-server", "paykit-server-e2e"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/pubky/paykit-server"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bitcoin = "=0.32.102"
bdk_electrum = { version = "=0.24.0", default-features = false, features = ["use-rustls-ring"] }
blake3 = "1"
chacha20poly1305 = "0.11"
crypto_secretbox = "0.1"
ed25519-dalek = "2"
hkdf = "0.13"
hmac = "0.13"
humantime-serde = "1"
locks-core = { git = "https://github.com/pubky/locks.git", tag = "v0.1.0-rc8" }
paykit-lib = { git = "https://github.com/pubky/paykit-rs.git", tag = "v0.1.0-rc66" }
paykit-sdk = { git = "https://github.com/pubky/paykit-rs.git", tag = "v0.1.0-rc66" }
pubky = "=0.14.0"
pubky-testnet = "=0.14.0"
prometheus-client = "0.25"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
serde_json_canonicalizer = "=0.3.2"
rand = "0.10"
rustls-pki-types = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["serde"] }

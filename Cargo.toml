[workspace]
members = ["paykit-server", "paykit-server-e2e"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/pubky/paykit-server"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bitcoin = "=0.32.101"
electrum-client = { version = "=0.25", default-features = false, features = ["proxy", "rustls-ring"] }
blake3 = "1"
chacha20poly1305 = "0.10"
crypto_secretbox = "0.1"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
humantime-serde = "1"
locks-core = { git = "https://github.com/pubky/locks.git", rev = "8502ef79c443c640976a2a901b80c5e717319149" }
paykit-lib = { git = "https://github.com/pubky/paykit-rs.git", rev = "4613beee25d1680ed8bc849446498e9bfb2cdb16" }
paykit-sdk = { git = "https://github.com/pubky/paykit-rs.git", rev = "4613beee25d1680ed8bc849446498e9bfb2cdb16" }
pubky = "=0.11.0"
pubky-testnet = "=0.11.0"
prometheus-client = "0.25"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
serde_json_canonicalizer = "=0.3.2"
rand = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring", "time", "uuid"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "test-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["serde"] }

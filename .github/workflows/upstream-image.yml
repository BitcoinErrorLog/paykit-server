name: Upstream source image

# Builds pubky/paykit-server at one exact upstream commit with upstream's own
# Dockerfile, unmodified, and publishes it under an immutable source tag.
on:
  push:
    branches: [cursor/upstream-image-4f6597f-8521]

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: pubky/paykit-server
  UPSTREAM_SHA: 4f6597f74c52a0a825eac88646aaae7a1382b38b
  IMAGE_NAME: paykit-server

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name from repository owner
        run: |
          set -eu
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/$owner/$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Check out upstream at the pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream

      - name: Verify checked-out commit
        run: test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish
        run: |
          set -eu
          metadata_file="$RUNNER_TEMP/push-metadata.json"
          docker buildx build \
            --file upstream/Dockerfile \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$UPSTREAM_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$UPSTREAM_REPOSITORY" \
            --tag "$IMAGE:upstream-$UPSTREAM_SHA" \
            --provenance=true \
            --push \
            --metadata-file "$metadata_file" \
            upstream
          digest="$(jq -r '."containerimage.digest" // empty' "$metadata_file")"
          case "$digest" in sha256:*) ;; *) echo "missing image digest" >&2; exit 1 ;; esac
          {
            echo "### Published upstream image"
            echo "- upstream: \`$UPSTREAM_REPOSITORY@$UPSTREAM_SHA\`"
            echo "- immutable image: \`$IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "IMMUTABLE_IMAGE=$IMAGE@$digest"

# Paykit Server closed TOML schema.
# This is a template, not a runnable configuration: add every trusted service
# public key locally and provide secrets only through the environment.
# Only executable-consumed keys are shown. The retired [inbox] section is rejected.

[http]
listen_addr = "127.0.0.1:8080"
# Exact number of reverse proxies in front of this listener that each append one
# X-Forwarded-For entry. 0 keys per-IP setup limits by the TCP peer and ignores
# the header. A value above the real proxy count lets clients pick their own
# limiter key. At most 8.
trusted_proxy_hops = 0

[signed_services]
# Non-empty, duplicate-free allowlist. Use exact canonical Pubkys rendered by
# Locks and Marketplace services. Overlap old and new keys during rotation.
# trusted_public_keys = ["pubky<locks-key>", "pubky<marketplace-key>"]

[setup]
# Configure exact HTTP(S) origins, or use ["*"] alone to accept any valid
# HTTP(S) parent. Even with "*", CSP and postMessage use the caller's concrete origin.
allowed_origins = ["https://app.example.invalid"]
# Keep false outside the controlled local Locks demo. When true, each setup flow
# writes its bearer-secret authorization URL to one log event. The operator owns
# log access and retention. The Locks-generated local config is the sole planned
# true setting.
log_authorization_url = false

[paykit]
# Stable grant owner checked by Paykit Server and by the local-demo companion
# Cargo example. Required exactly as shown; missing or other values are rejected.
client_id = "app.paykit.server"
app_id = "paykit-server"
# New proposals must be accepted before this window closes. Payment must then
# complete before payment_window, measured from same invoice creation instant.
proposal_acceptance_window = "1h"
payment_window = "24h"
# BTC conversion quotes expire sooner. Acceptance is capped at half this window.
conversion_payment_window = "1h"
# Unpublished Marketplace preparations may activate only within this DB-clock TTL.
marketplace_prepare_ttl = "15m"
# "testnet" targets the pinned Pubky client's fixed localhost testnet ports.
# Run the Pubky static testnet; this is not a hosted public network.
network = "testnet"

[bitcoin]
# Must match the supplied Creator xpubs, derived addresses, and Electrum chain.
network = "testnet"

[electrum]
# Use one CA-valid ssl:// endpoint in production. tcp:// is accepted but has no
# server authentication or transport confidentiality. No failover pool exists.
endpoint = "ssl://electrum.example.invalid:50002"
poll_interval = "10s"
request_timeout = "10s"
connect_retries = 1

[outbox]
poll_interval = "5s"
batch_size = 16
lease_duration = "30s"
retry_initial = "1s"
retry_max = "5m"
# Keep Encrypted Link establishment retries fast for this many outbox attempts
# before switching to retry_initial/retry_max backoff, capped at 5s for link
# establishment failures. Integer range: 1..=2147483647; default: 120.
rapid_link_retry_attempts = 120
# Integer milliseconds between rapid link-establishment retries. Range:
# 1..=4294967295; default: 1000. For example, 500 means 0.5 seconds.
rapid_link_retry_interval_ms = 1000

[limits]
request_body_bytes = 16384
lock_resource_bytes = 262144
lock_fetch_timeout = "10s"

[rate_limits]
signed_requests_per_second = 100
signed_burst = 200
setup_per_ip_per_minute = 10
max_pending_setup_flows = 100
max_completion_polls_per_flow = 2
max_completion_polls = 200

[shutdown]
drain_timeout = "30s"

# Optional direct Arbitrum One USDT0 receiving and receipt verification.
# Keep provider credentials in the operator-owned config, never in client URLs.
# [usdt]
# rpc_url = "https://your-arbitrum-rpc.example/"

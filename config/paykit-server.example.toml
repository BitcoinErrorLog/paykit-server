# Paykit Server closed TOML schema.
# This is a template, not a runnable configuration: add the required trusted
# Locks public key locally and provide secrets only through the environment.
# Only executable-consumed keys are shown. The retired [inbox] section is rejected.

[http]
listen_addr = "127.0.0.1:8080"

[locks]
# Use the exact Pubky rendered by Locks as credentials.lock_server_public_key.
# trusted_public_key = "pubky<pubky-key>"

# Optional marketplace transaction-service trust anchors. Requests signed by
# any listed key are accepted on the signed business routes exactly like Lock
# Server signatures. Use the single-key form for one marketplace signer, or
# the list form when several marketplace-service instances (for example
# production and staging) each sign with their own key. The two forms are
# mutually exclusive; a malformed or empty list fails startup.
# [marketplace]
# trusted_public_key = "pubky<pubky-key>"
# or:
# trusted_public_keys = ["pubky<production-key>", "pubky<staging-key>"]

[setup]
# Configure exact HTTP(S) origins, or use ["*"] alone to accept any valid
# HTTP(S) parent. Even with "*", CSP and postMessage use the caller's concrete origin.
allowed_origins = ["https://app.example.invalid"]

[paykit]
receiver_path = "bitkit/server"
receiver_path_priority = ["bitkit"]
# "testnet" targets the pinned Pubky client's fixed localhost testnet ports.
# Run the Pubky Core static testnet; this is not a hosted public network.
network = "testnet"

[bitcoin]
# Must match the supplied Creator xpubs, derived addresses, and Electrum chain.
network = "testnet"

[deployment]
# Required, no default. "production" serves real-money traffic; "proof" marks
# proof-of-concept stacks. The role is persisted adopt-once: a database that
# has never recorded a role adopts the configured one on first boot, and every
# later boot refuses to start when the configured role differs.
stack_role = "proof"

[electrum]
# Use one CA-valid ssl:// endpoint in production. tcp:// is accepted but has no
# server authentication or transport confidentiality. No failover pool exists.
endpoint = "ssl://electrum.example.invalid:50002"
poll_interval = "10s"
request_timeout = "10s"
connect_retries = 1

[outbox]
poll_interval = "5s"
batch_size = 16
lease_duration = "30s"
retry_initial = "1s"
retry_max = "5m"

[limits]
request_body_bytes = 16384
lock_resource_bytes = 262144
lock_fetch_timeout = "10s"

[rate_limits]
signed_requests_per_second = 100
signed_burst = 200
setup_per_ip_per_minute = 10
max_pending_setup_flows = 100
max_completion_polls_per_flow = 2
max_completion_polls = 200

[shutdown]
drain_timeout = "30s"
